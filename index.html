<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぽちっと日記</title>
<meta name="theme-color" content="#f6f1e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ぽちっと日記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#3a322a; --sub:#8a7f73; --line:#e8dfd2;
  --accent:#d9704f; --accent-soft:#fbe4da; --accent-ink:#9c4227; --ok:#5b8c5a;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1f1b17;--card:#2a2520;--ink:#efe7dc;--sub:#a99d8f;--line:#3c352d;
    --accent:#e88a6a;--accent-soft:#4a2f25;--accent-ink:#ffc7b1;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:6px;padding:10px 0}
.hbar .title{flex:1;text-align:center;position:relative}
.hbar .date{font-weight:700;font-size:18px;display:block}
.hbar .rel{font-size:12px;color:var(--sub);display:block;min-height:18px}
.hbar input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.navbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px}
.todaybtn{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.status{font-size:11px;color:var(--sub);text-align:right;padding:0 0 6px;min-height:16px}
.status.ok{color:var(--ok)}

/* cards */
.card{background:var(--card);border-radius:16px;padding:12px 14px 14px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.clear{border:none;background:none;color:var(--sub);font-size:12px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 13px;font-size:15px;
  transition:transform .08s,background .15s,border-color .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
textarea,input[type=text],input[type=search]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:10px 12px;resize:none;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--accent)}
.section-t{font-size:13px;color:var(--sub);margin:22px 4px 6px;font-weight:700;letter-spacing:.05em}

/* lookback */
.lb{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.lb.empty{opacity:.55;box-shadow:none}
.lb-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lb-h b{font-size:16px}
.lb-h span{font-size:12px;color:var(--sub)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tag i{font-style:normal;color:var(--sub);font-size:11px;margin-right:4px}
.txt{font-size:13px;margin-top:6px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.txt i{font-style:normal;color:var(--sub);font-size:11px;margin-right:6px}
.peek{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scroll-snap-type:x mandatory}
.peek .lb{min-width:78%;scroll-snap-align:start;margin:0}

/* calendar */
.calbar{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.calbar b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
.wd:first-child{color:#c45a5a}.wd:last-child{color:#5a7ac4}
.day{aspect-ratio:1/1.15;border-radius:12px;border:1px solid transparent;background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:4px 0;font-size:12px}
.day .em{font-size:20px;line-height:1.3;margin-top:2px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent-soft)}
.day.blank{background:transparent}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}

/* settings */
.item-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin:8px 0}
.item-row .nm{flex:1;min-width:0}
.item-row .nm b{display:block;font-size:15px}
.item-row .nm small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;flex:none}
.ib:disabled{opacity:.3}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;margin:10px 0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#c0392b;border-color:#e8b4ad}
.note{font-size:12px;color:var(--sub);margin:8px 4px;line-height:1.7}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:none;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--sub)}
nav.tabs button .ic{font-size:21px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--accent-ink);font-weight:700}
nav.tabs button.on .ic{filter:none;opacity:1}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,12,5,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:13px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--sub);padding:60px 0}
section.card:has(textarea){padding:8px 12px 10px;margin:8px 0}
section.card:has(textarea) .card-h{margin-bottom:5px}
section.card:has(textarea) .card-h h3{font-size:14px}
section.card textarea{padding:8px 10px}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:13px}
.banner span{flex:1}
.banner button{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;flex:none}
.steps{font-size:13px;line-height:1.8;margin:6px 0 0;padding-left:1.3em;color:var(--ink)}

/* vertical slider panel */
.eqp{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 8px 6px;margin:10px 0}
.eqinfo{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--sub);min-height:20px;margin-bottom:4px}
.eqinfo b{color:var(--ink)}
.eqinfo .d{width:10px;height:10px;border-radius:50%}
.eq{display:flex;gap:6px}
.grpv{display:flex;flex-direction:column;min-width:0;background:var(--bg);border-radius:12px;padding:2px 2px 4px}
.gt{font:inherit;font-size:13px;font-weight:700;color:var(--ink);text-align:center;border:none;background:none;padding:4px 0 2px;white-space:nowrap;border-radius:8px}
.gt:active{background:var(--line)}
.cols{display:flex;gap:2px}
.vcell{flex:1 1 0;display:flex;flex-direction:column;align-items:center;min-width:0}
.vend{font-size:13px;line-height:1;height:18px;display:flex;align-items:center}
.vtrk{position:relative;width:100%;height:118px;margin:6px 0;touch-action:pan-y;cursor:pointer;outline:none}
.vbar{position:absolute;top:-4px;bottom:-4px;left:50%;width:10px;margin-left:-5px;border-radius:999px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.unset .vbar{opacity:.35}
.vth{position:absolute;left:50%;width:30px;height:30px;transform:translate(-50%,50%);border-radius:50%;border:2px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;z-index:1}
.dragging .vth{transform:translate(-50%,50%) scale(1.15);cursor:grabbing}
.te{font-size:17px;line-height:1}
.unset .vth{display:none}
.vtrk:focus-visible .vbar{box-shadow:0 0 0 3px var(--accent-soft)}
.vsub{font-size:10px;color:var(--sub);font-weight:700;white-space:nowrap;line-height:1.2}
.dl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.dl .d{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.dl .w{flex:1;color:var(--sub)}
.dl .clear{border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 12px;margin:14px 0 4px}
.sbox input{flex:1;border:none;background:none;font:inherit;color:inherit;padding:8px 0;outline:none;font-size:16px}
mark{background:#ffe08a;color:inherit;border-radius:3px;padding:0 1px}
/* scale slider (compact) */
.card.sc-card{padding:8px 12px 6px;margin:8px 0}
.scale{min-width:0}
.sc-head{display:flex;align-items:center;gap:6px;min-height:22px}
.sc-name{font-weight:700;font-size:14px;flex:none}
.sc-val{display:flex;align-items:center;gap:5px;font-size:13px;min-width:0;flex:1;justify-content:flex-end;white-space:nowrap;overflow:hidden}
.sc-val b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.scale.unset .sc-val b{color:var(--sub);font-size:12px}
.sc-dot{width:10px;height:10px;border-radius:50%;flex:none}
.scale.unset .sc-dot{display:none}
.clear.x{width:22px;height:22px;padding:0;border-radius:50%;font-size:12px;line-height:1;flex:none;background:var(--bg);border:1px solid var(--line)}
.scale.unset .clear.x{visibility:hidden}
.sc-row{display:flex;align-items:center;gap:6px}
.sc-end{font-size:15px;flex:none;width:20px;text-align:center}
.sc-track{position:relative;flex:1;height:28px;touch-action:none;cursor:pointer;outline:none}
.sc-bar{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;border-radius:999px;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.scale.unset .sc-bar{opacity:.4}
.sc-thumb{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);
  border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.scale.unset .sc-thumb{display:none}
.sc-track:focus-visible .sc-bar{box-shadow:0 0 0 3px var(--accent-soft)}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.grp-h h3{margin:0;font-size:14px}
.grp-h small{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:grid;gap:4px 12px}
.grp .sc-name{font-size:12px;color:var(--sub);font-weight:700}
.grp .sc-head{gap:3px}
.grp .sc-val{font-size:11.5px;gap:0}
.grp .sc-dot{display:none}
.grp .clear.x{width:18px;height:18px;font-size:10px}
#f-prev{width:14px;height:90px;border-radius:999px;margin-left:8px}
.tag .d{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.day .cdot{width:20px;height:20px;border-radius:50%;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sc-edit{display:grid;grid-template-columns:auto 44px 1fr;gap:8px;align-items:center}
.sc-edit span{font-size:12px;color:var(--sub)}
.sc-edit input[type=color]{width:44px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.seg button{flex:1 1 40%}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hbar">
    <button class="navbtn" id="prev" aria-label="前の日">‹</button>
    <div class="title">
      <span class="date" id="hdate"></span>
      <span class="rel" id="hrel"></span>
      <input type="date" id="picker" aria-label="日付を選ぶ">
    </div>
    <button class="navbtn" id="next" aria-label="次の日">›</button>
  </div>
  <div class="status" id="status"></div>
</div></header>

<main class="wrap" id="view"><div class="loading">読み込み中…</div></main>

<nav class="tabs"><div class="in">
  <button data-tab="record"><span class="ic">✏️</span>記録</button>
  <button data-tab="look"><span class="ic">🕰️</span>あの日</button>
  <button data-tab="cal"><span class="ic">📅</span>カレンダー</button>
  <button data-tab="search"><span class="ic">🔍</span>検索</button>
  <button data-tab="items"><span class="ic">⚙️</span>項目</button>
</div></nav>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- defaults ---------- */
const WEATHER = {type:'scale', left:{label:'🌀 荒天', color:'#3f78d1'}, mid:{label:'⛅ くもり', color:'#a8a29e'}, right:{label:'☀️ 晴天', color:'#f08a2c'}};
const TEMP = {type:'scale', left:{label:'🥶 寒い', color:'#2f7fd0'}, mid:{label:'😊 快適', color:'#a8a29e'}, right:{label:'🥵 暑い', color:'#e04a35'}};
const SETTINGS_VERSION = 4;
const DEFAULT_ITEMS = [
  {id:'weather_am', name:'天気（午前）', icon:'🌤️', short:'午前', ...WEATHER},
  {id:'weather_pm', name:'天気（午後）', icon:'🌤️', short:'午後', ...WEATHER},
  {id:'temp_morning', name:'気温（朝）', icon:'🌡️', short:'朝', ...TEMP},
  {id:'temp_noon', name:'気温（昼）', icon:'🌡️', short:'昼', ...TEMP},
  {id:'temp_night', name:'気温（夜）', icon:'🌡️', short:'夜', ...TEMP},
  {id:'mood', name:'調子', type:'scale', left:{label:'😞 不調', color:'#6a6fb0'}, mid:{label:'😐 ふつう', color:'#a8a29e'}, right:{label:'😄 好調', color:'#f2b02e'}},
  {id:'family', name:'家族', icon:'👪', type:'scale', left:{label:'😟 心配', color:'#6a6fb0'}, mid:{label:'🙂 ふつう', color:'#a8a29e'}, right:{label:'😊 元気', color:'#f29a3a'}},
  {id:'work', name:'仕事', icon:'💼', type:'scale', left:{label:'🏖️ ゆとり', color:'#3aa8a0'}, mid:{label:'🙂 ふつう', color:'#a8a29e'}, right:{label:'🔥 大変', color:'#e04a35'}},
  {id:'exercise', name:'運動', icon:'👟', type:'scale', left:{label:'🛋️ なし', color:'#8c9bb0'}, mid:{label:'🚶 少し', color:'#a8a29e'}, right:{label:'🏃 しっかり', color:'#2fae5e'}},
  {id:'am_did', name:'午前にしたこと', type:'text', placeholder:'例：散歩、図書館、買い物'},
  {id:'pm_did', name:'午後にしたこと', type:'text', placeholder:'例：昼寝、庭の手入れ、友人と会う'},
  {id:'events', name:'今日の出来事', type:'text', placeholder:'身の回りのこと、世の中のことなど'},
  {id:'bought', name:'買ったもの', type:'text'},
  {id:'videos', name:'コンテンツ', type:'text', placeholder:'ドラマ・映画・本・動画など'},
];
/* Upgrade saved item settings to v3 without touching any recorded data
   (records are keyed by item id, and ids never change). */
/* v4: 調子 is one slider (the old 体調 is kept only for past records),
   weather sub labels in Japanese. Records keep their ids, so nothing is lost. */
function migrateV4(items) {
  const def = Object.fromEntries(DEFAULT_ITEMS.map(i => [i.id, i]));
  return items.filter(i => i.id !== 'health').map(i => {
    if (i.id === 'mood') { const n = {...i, name: '調子', left: def.mood.left, mid: def.mood.mid, right: def.mood.right}; delete n.short; return n; }
    if (i.id === 'weather_am' || i.id === 'weather_pm') return {...i, short: def[i.id].short};
    return i;
  });
}
function migrateV3(items) {
  const def = Object.fromEntries(DEFAULT_ITEMS.map(i => [i.id, i]));
  let out = items.filter(i => i.id !== 'news').map(i => {
    const d = def[i.id]; if (!d) return i;
    const n = {...i};
    ['name', 'icon', 'short', 'placeholder'].forEach(k => { if (d[k] !== undefined) n[k] = d[k]; });
    return n;
  });
  const hi = out.findIndex(i => i.id === 'health'), mi = out.findIndex(i => i.id === 'mood');
  if (hi >= 0 && mi >= 0 && hi !== mi + 1) { const [x] = out.splice(hi, 1); out.splice(out.findIndex(i => i.id === 'mood') + 1, 0, x); }
  const add = ['am_did', 'pm_did'].filter(id => !out.some(i => i.id === id)).map(id => clone(def[id]));
  if (add.length) { let ti = out.findIndex(i => i.type === 'text'); if (ti < 0) ti = out.length; out.splice(ti, 0, ...add); }
  return out;
}
const LOOKBACKS = [
  {l:'1週間前', d:-7}, {l:'1ヶ月前', m:-1}, {l:'1年前', y:-1}, {l:'2年前', y:-2},
  {l:'3年前', y:-3}, {l:'5年前', y:-5}, {l:'10年前', y:-10},
];
const TYPE_LABEL = {scale:'スライダー', choice:'選択（1つ）', multi:'選択（複数OK）', text:'自由記載'};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = '日月火水木金土';
const fmt = (s, yr=true) => { const d = parse(s); return `${yr ? d.getFullYear()+'年' : ''}${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; };
function shift(s, {y=0, m=0, d=0}) {
  const t = parse(s);
  if (d) { t.setDate(t.getDate() + d); return ymd(t); }
  const ty = t.getFullYear() + y, tm = t.getMonth() + m;

  h += '</div><p class="note">日付をタップすると、その日の記録を開きます。</p>';

}

/* ---------- render ---------- */
function renderHeader() {
  $('#hdate').textContent = fmt(state.date);
  const rel = relLabel(state.date);
  $('#hrel').innerHTML = rel === '今日' ? '今日' : `${esc(rel)}　<button class="todaybtn" id="gotoday">今日へ</button>`;

  const showDate = state.tab === 'record' || state.tab === 'look';
  $('header').style.display = showDate ? '' : 'none';
}
let renderSeq = 0;
async function render() {
  renderHeader();
  const v = $('#view'), seq = ++renderSeq;
  if (!state.ready) { v.innerHTML = '<div class="loading">読み込み中…</div>'; return; }
  if (state.tab === 'record') {
    v.innerHTML = viewRecord();
    v.querySelectorAll('textarea').forEach(autoGrow);
    fillPeek();
  } else if (state.tab === 'look') {

}
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight + 2, 40) + 'px'; }

async function goDate(d) {
  flush();
  state.date = d;
  state.entry = await getEntry(d);
  if (state.date !== d) return;
  render();
  window.scrollTo(0, 0);
}

$('#prev').onclick = () => goDate(shift(state.date, {d: -1}));

$('#picker').onchange = e => { if (e.target.value) goDate(e.target.value); };
$('#hrel').onclick = e => { if (e.target.id === 'gotoday') goDate(today()); };
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {

$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.item) {

    const opt = it.options[+b.dataset.opt];
    const cur = state.entry && state.entry.values ? state.entry.values[it.id] : undefined;
    let nv;
    if (it.type === 'multi') { const arr = Array.isArray(cur) ? cur.slice() : []; const k = arr.indexOf(opt); k >= 0 ? arr.splice(k, 1) : arr.push(opt); nv = arr; }
    else nv = cur === opt ? null : opt;

    if (!isEmptyVal(nv) && !cl) h.insertAdjacentHTML('beforeend', `<button class="clear" data-clear="${esc(it.id)}">クリア</button>`);
    scheduleSave(400);

  } else if (b.dataset.go) {

      state.items.forEach(retire); state.items = clone(DEFAULT_ITEMS); saveItems(); render(); toast('初期設定に戻しました');

$('#view').addEventListener('input', e => {

});
/* vertical sliders: tap the bar to set a value, drag the ● to adjust.
   Swiping on the bar still scrolls the page, so scrolling never changes a value. */
const posValue = (tr, y) => { const r = tr.getBoundingClientRect(); return Math.round(Math.min(1, Math.max(0, (r.bottom - y) / r.height)) * 100); };
function cellCtx(el) {
  const cell = el.closest('.vcell'); if (!cell) return null;
  const it = state.items.find(i => i.id === cell.dataset.scale); if (!it) return null;
  return {cell, it, tr: cell.querySelector('.vtrk')};
}
function applyV(c, v) { setValue(c.it.id, v); updateScaleUI(c.cell, c.it, v); showInfo(c.it, v); }
$('#view').addEventListener('pointerdown', e => {
  const thumb = e.target.closest('.vth');
  const c = (thumb || e.target.closest('.vtrk')) && cellCtx(e.target); if (!c) return;
  if (thumb) {
    e.preventDefault();
    try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
    c.cell.classList.add('dragging'); setStatus('');
    const mv = ev => applyV(c, posValue(c.tr, ev.clientY));
    const up = () => {
      thumb.removeEventListener('pointermove', mv); thumb.removeEventListener('pointerup', up); thumb.removeEventListener('pointercancel', up);
      c.cell.classList.remove('dragging'); scheduleSave(400);
    };
    thumb.addEventListener('pointermove', mv); thumb.addEventListener('pointerup', up); thumb.addEventListener('pointercancel', up);
    return;
  }
  // a tap on the bar (not a scroll)
  const x0 = e.clientX, y0 = e.clientY, tr = c.tr;
  const up = ev => {
    cleanup();
    if (Math.abs(ev.clientX - x0) < 10 && Math.abs(ev.clientY - y0) < 10) { applyV(c, posValue(tr, ev.clientY)); setStatus(''); scheduleSave(400); }
  };
  const cleanup = () => { tr.removeEventListener('pointerup', up); tr.removeEventListener('pointercancel', cleanup); };
  tr.addEventListener('pointerup', up); tr.addEventListener('pointercancel', cleanup);
});
$('#view').addEventListener('keydown', e => {
  const tr = e.target.closest && e.target.closest('.vtrk'); if (!tr) return;
  const d = {ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5}[e.key]; if (!d) return;
  e.preventDefault();
  const c = cellCtx(tr); if (!c) return;
  const cur = state.entry && state.entry.values && isNum(state.entry.values[c.it.id]) ? state.entry.values[c.it.id] : 50;
  applyV(c, Math.min(100, Math.max(0, cur + d))); scheduleSave(600);
});
$('#view').addEventListener('change', e => {

});
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

/* ---------- items editing ---------- */
function retire(it) {
  if (!it || state.retired.some(r => r.id === it.id)) return;
  state.retired.push(clone(it));
}
function saveItems() {
  setStatus('保存中…');
  store.saveSettings({items: state.items, retired: state.retired, version: SETTINGS_VERSION, updatedAt: new Date().toISOString()})
    .then(() => setStatus('✓ 項目を保存しました', true))

}
function openSheet(html) {

  m.querySelector('.mask').addEventListener('click', e => { if (e.target.classList.contains('mask')) closeSheet(); });

}
function closeSheet() { $('#modal').innerHTML = ''; }
function confirmSheet(title, body, okLabel, onOk) {
  const s = openSheet(`<h2>${esc(title)}</h2><p class="note" style="font-size:14px">${esc(body)}</p>
    <div class="row2"><button class="btn" data-x>やめる</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`);

function editItem(idx) {
  const isNew = idx < 0;
  const it = isNew ? {id: 'i' + Date.now().toString(36), name: '', type: 'scale', options: []} : clone(state.items[idx]);
  const sc = {

  const s = openSheet(`<h2>${isNew ? '項目を追加' : '項目を編集'}</h2>

    <div id="f-optwrap"><label>選択肢（1行に1つ。先頭に絵文字＋スペースを付けるとカレンダーに表示されます）</label>
    <textarea id="f-opts" rows="6" placeholder="😴 よく眠れた&#10;🙂 ふつう&#10;🥱 寝不足">${esc((it.options || []).join('\n'))}</textarea></div>
    <div id="f-scwrap"><label>上端・中央・下端の名前と色（四角をタップで色を変更）</label>
      <div class="sc-edit">${scRow('right', '上端', '例：😴 ぐっすり')}${scRow('mid', '中央', '例：🙂 ふつう')}${scRow('left', '下端', '例：🥱 寝不足')}</div>
      <label>プレビュー</label><div id="f-prev"></div>
      <label>横並び時の短い表示（任意）</label><input type="text" id="f-short" value="${esc(it.short || '')}" placeholder="例：朝"></div>
    <div class="row2" style="margin-top:14px"><button class="btn" data-x>キャンセル</button><button class="btn primary" data-save>保存</button></div>
    ${isNew ? '' : '<button class="btn danger" data-del>この項目を削除</button>'}`);
  const optWrap = s.querySelector('#f-optwrap');
  const scWrap = s.querySelector('#f-scwrap');
  const readSc = () => ['left', 'mid', 'right'].forEach(k => {
    sc[k] = {label: s.querySelector(`#f-${k}l`).value.trim(), color: safeColor(s.querySelector(`#f-${k}c`).value, sc[k].color)};
  });
  const syncPrev = () => { readSc(); s.querySelector('#f-prev').style.background = vgradient(sc); };
  scWrap.addEventListener('input', syncPrev); syncPrev();
  const syncType = () => {
    optWrap.style.display = it.type === 'choice' || it.type === 'multi' ? '' : 'none';
    scWrap.style.display = it.type === 'scale' ? '' : 'none';
  };
  syncType();
  s.querySelectorAll('#f-type button').forEach(b => b.onclick = () => {
    it.type = b.dataset.t; s.querySelectorAll('#f-type button').forEach(x => x.classList.toggle('on', x === b)); syncType();
  });

    it.name = name;

      retire(state.items[idx]); state.items.splice(idx, 1); saveItems(); render(); toast('削除しました');
    });
  };
}

async function backup() {
  let entries = [];
  try { entries = await store.all(); } catch (e) { toast('読み込みに失敗しました'); return; }
  entries.sort((a, b) => a.date < b.date ? -1 : 1);
  const json = JSON.stringify({app: 'pochi-diary', format: 1, exportedAt: new Date().toISOString(), items: state.items, retired: state.retired, entries});
  const name = `pochi-diary-backup-${today()}.json`;
  const blob = new Blob([json], {type: 'application/json'});
  let file = null; try { file = new File([blob], name, {type: 'application/json'}); } catch (e) {}
  const canShare = !!(file && navigator.canShare && navigator.canShare({files: [file]}));
  const kb = Math.max(1, Math.round(blob.size / 1024));
  const s = openSheet(`<h2>バックアップ</h2>
    <p class="note" style="font-size:14px">${entries.length}日分の記録（約${kb}KB）をファイルにします。</p>
    ${canShare ? `<button class="btn primary" data-share>共有メニューから OneDrive に保存</button>
    <ol class="steps"><li>上のボタンを押す</li><li>出てきたメニューで <b>OneDrive</b> を選ぶ（iPhoneで見つからない時は「"ファイル"に保存」→ OneDrive）</li><li>保存先フォルダ（例：日記バックアップ）を選んで保存</li></ol>` : ''}
    <button class="btn${canShare ? '' : ' primary'}" data-dl>ファイルとしてダウンロード</button>
    ${canShare ? '' : '<p class="note">ダウンロードしたファイルを、OneDrive アプリやエクスプローラーで OneDrive のフォルダに入れてください。</p>'}
    <button class="btn" data-x>閉じる</button>`);
  s.querySelector('[data-x]').onclick = closeSheet;
  const done = async () => {
    state.lastBackup = new Date().toISOString();
    try { await store.setKV('lastBackup', state.lastBackup); } catch (e) {}
    closeSheet(); render(); toast('バックアップしました');
  };
  const sh = s.querySelector('[data-share]');
  if (sh) sh.onclick = async () => {
    try { await navigator.share({files: [file], title: name}); done(); }
    catch (e) { if (e && e.name !== 'AbortError') toast('共有できませんでした。ダウンロードをお試しください'); }
  };
  s.querySelector('[data-dl]').onclick = () => {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done();
  };
}

function restoreFlow() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { toast('ファイルを読み込めませんでした'); return; }
    const list = Array.isArray(data && data.entries) ? data.entries.filter(e => e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && e.values) : null;
    if (!list) { toast('ぽちっと日記のバックアップではないようです'); return; }
    const range = list.length ? `${fmt(list.reduce((a, e) => e.date < a ? e.date : a, list[0].date))} 〜 ${fmt(list.reduce((a, e) => e.date > a ? e.date : a, list[0].date))}` : '';
    const s = openSheet(`<h2>バックアップから復元</h2>
      <p class="note" style="font-size:14px">${esc(f.name)}<br>${list.length}日分 ${esc(range)}</p>
      <button class="btn primary" data-merge>今の記録とまとめる（新しい方を残す）</button>
      <button class="btn danger" data-replace>今の記録を消して置き換える</button>
      <p class="note">機種変更などで新しいスマホに移すときは、どちらでも同じ結果になります。</p>
      <button class="btn" data-x>キャンセル</button>`);
    s.querySelector('[data-x]').onclick = closeSheet;
    const finish = async () => {
      state.cache = {}; state.count = (await store.all()).length;
      state.entry = await getEntry(state.date); closeSheet(); render(); toast(`${list.length}日分を復元しました`);
    };
    s.querySelector('[data-merge]').onclick = async () => {
      try {
        const cur = {}; (await store.all()).forEach(e => { cur[e.date] = e; });
        const take = list.filter(e => !cur[e.date] || (e.updatedAt || '') > (cur[e.date].updatedAt || ''));
        await store.putMany(take, false);
        if (Array.isArray(data.retired)) data.retired.forEach(retire);
        await finish();
      } catch (e) { toast('復元に失敗しました'); }
    };
    s.querySelector('[data-replace]').onclick = async () => {
      try {
        await store.putMany(list, true);
        if (Array.isArray(data.items) && data.items.length) state.items = data.items;
        state.retired = Array.isArray(data.retired) ? data.retired : [];
        saveItems(); await finish();
      } catch (e) { toast('復元に失敗しました'); }
    };
  };
  inp.click();
}

/* ---------- init ---------- */
(async function init() {
  render();
  try { idb = await openIDB(); } catch (e) { idb = null; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try {
    const s = await store.getSettings();
    if (s && Array.isArray(s.retired)) s.retired.forEach(x => { state.retired = state.retired.filter(y => y.id !== x.id); state.retired.push(x); });
    if (s && Array.isArray(s.items) && s.items.length) {
      state.items = s.items;
      const ver = s.version || 1;
      if (ver < 3) {
        const news = state.items.find(i => i.id === 'news'); if (news) retire(news);
        state.items = migrateV3(state.items);
      }
      if (ver < 4) {
        const hl = state.items.find(i => i.id === 'health'); if (hl) retire({...hl, name: '体調'});
        state.items = migrateV4(state.items);
      }
      if (ver < SETTINGS_VERSION) saveItems();
    }
  } catch (e) {}
  try { state.lastBackup = (await store.getKV('lastBackup')) || null; } catch (e) {}
  try { state.count = (await store.all()).length; } catch (e) {}
  state.entry = await getEntry(state.date);
  state.ready = true;
  setStatus(idb ? '' : '⚠️ このブラウザでは保存が不安定です（プライベートモード？）');
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
